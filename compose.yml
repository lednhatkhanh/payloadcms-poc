name: payload-newsroom

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payload_newsroom}
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload_dev_only}
    ports:
      - '5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-payload_newsroom}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - payload_postgres_data:/var/lib/postgresql

volumes:
  payload_postgres_data:
